<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Your Term, Mapped</title>
<meta name="theme-color" content="#1F3B2E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Term Tracker" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Your Term, Mapped","short_name":"Term Tracker","start_url":".","display":"standalone","background_color":"%231F3B2E","theme_color":"%231F3B2E"}' />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1F3B2E; --board-dark:#16291F; --board-deep:#122019; --chalk:#F3F0E4; --chalk-dim:#9FB3A8;
    --yellow:#E8C468; --coral:#E2725B; --rail:#2A4A3A; --rail-light:#365A47; --green:#8FD9A8;
    --radius:14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--board); font-family:'Inter',sans-serif; color:var(--chalk); line-height:1.4; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 18px 72px; }
  header.app-head { margin-bottom:22px; }
  h1 { font-family:'Kalam',cursive; font-size:32px; margin:0 0 6px; line-height:1.15; }
  .sub { color:var(--chalk-dim); font-size:13.5px; margin:0; max-width:46ch; }

  nav#tabs { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 14px; margin-bottom:18px; border-bottom:1px solid var(--rail); scrollbar-width:none; }
  nav#tabs::-webkit-scrollbar { display:none; }
  nav#tabs button { flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--board-dark); border:1px solid var(--rail); color:var(--chalk-dim); padding:8px 14px; border-radius:999px; font-size:13px; font-family:'Inter',sans-serif; font-weight:500; cursor:pointer; white-space:nowrap; transition:background .15s,color .15s,border-color .15s; }
  nav#tabs button svg { width:15px; height:15px; flex-shrink:0; }
  nav#tabs button.active { background:var(--yellow); color:var(--board-deep); border-color:var(--yellow); font-weight:600; }

  .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .section-head h2 { font-family:'Kalam',cursive; font-size:24px; margin:0 0 2px; }
  .section-head p { color:var(--chalk-dim); font-size:13px; margin:0; }

  .btn-add { background:var(--yellow); color:var(--board-deep); border:none; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
  .btn-add:disabled { opacity:.6; }
  .btn-add svg { width:15px; height:15px; }

  .empty { border:1px dashed var(--rail-light); border-radius:var(--radius); padding:28px 20px; text-align:center; color:var(--chalk-dim); font-size:14px; line-height:1.5; }

  .card { background:var(--board-dark); border:1px solid var(--rail); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card .main { min-width:0; flex:1; display:flex; align-items:center; gap:12px; }
  .tag { font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; background:var(--rail); color:var(--yellow); padding:3px 7px; border-radius:5px; letter-spacing:.02em; }
  .title { font-size:14.5px; font-weight:500; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--chalk-dim); }
  .del { background:none; border:none; color:var(--chalk-dim); cursor:pointer; padding:6px; border-radius:8px; flex-shrink:0; }
  .del svg { width:16px; height:16px; }
  .del:hover { background:var(--rail); }

  .form { background:var(--rail); border:1px solid var(--rail-light); border-radius:var(--radius); padding:16px; margin-bottom:18px; display:grid; gap:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label.field { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--chalk-dim); }
  input, select { background:var(--board-deep); color:var(--chalk); border:1px solid var(--rail-light); border-radius:8px; padding:9px 10px; font-family:'IBM Plex Mono',monospace; font-size:13.5px; }
  input:focus, select:focus { outline:2px solid var(--yellow); outline-offset:1px; }
  .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:2px; }
  .btn-ghost { background:none; border:none; color:var(--chalk-dim); font-size:12.5px; padding:8px 12px; cursor:pointer; border-radius:8px; }
  .btn-save { background:var(--yellow); color:var(--board-deep); border:none; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-save svg { width:15px; height:15px; flex-shrink:0; }

  .check-btn { width:21px; height:21px; border:1.5px solid var(--yellow); border-radius:6px; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .check-btn.done { background:var(--yellow); }
  .bar-bg { height:6px; border-radius:99px; background:var(--rail); margin:8px 0 10px; }
  .bar-fill { height:6px; border-radius:99px; }
  .att-actions button { font-size:12px; padding:6px 12px; border-radius:8px; border:none; margin-right:8px; cursor:pointer; background:var(--rail); font-weight:500; }

  .drop { border:1.5px dashed var(--rail-light); border-radius:var(--radius); padding:32px 20px; text-align:center; cursor:pointer; }
  .thumbs { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .thumb { position:relative; width:76px; height:76px; }
  .thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--rail); }
  .thumb button { position:absolute; top:-6px; right:-6px; background:var(--coral); border:none; border-radius:99px; width:19px; height:19px; color:var(--chalk); cursor:pointer; font-size:11px; line-height:1; }

  .warn { display:flex; gap:10px; background:var(--rail); border-left:3px solid var(--yellow); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; line-height:1.5; }
  .warn svg { width:18px; height:18px; flex-shrink:0; margin-top:1px; }

  .review-item { display:flex; gap:10px; align-items:flex-start; background:var(--board-dark); border:1px solid var(--rail); border-radius:var(--radius); padding:14px 16px; margin-bottom:8px; cursor:pointer; }
  .note { font-size:12.5px; color:var(--chalk-dim); margin-bottom:14px; line-height:1.5; }

  details.portal-group { background:var(--board-dark); border:1px solid var(--rail); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  details.portal-group summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; color:var(--chalk); font-weight:600; font-size:14.5px; }
  details.portal-group summary::-webkit-details-marker { display:none; }
  details.portal-group summary .chev { transition:transform .15s; color:var(--chalk-dim); }
  details.portal-group summary .chev svg { width:14px; height:14px; }
  details.portal-group[open] summary .chev { transform:rotate(90deg); }
  details.portal-group .group-body { padding:0 14px 14px; }
  details.portal-group .card { background:var(--board-deep); }

  .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .account-wrap { position:relative; }
  .account-btn svg { width:16px; height:16px; }
  .account-btn { background:var(--board-deep); border:1px solid var(--rail-light); color:var(--chalk); border-radius:10px; padding:9px 12px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; }
  .account-menu { position:absolute; right:0; top:calc(100% + 8px); z-index:1000; width:min(300px, calc(100vw - 32px)); background:var(--board-deep); border:1px solid var(--rail-light); border-radius:14px; padding:8px; box-shadow:0 18px 45px rgba(0,0,0,.35); }
  .account-item { width:100%; text-align:left; background:transparent; border:0; color:var(--chalk); padding:11px 12px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .account-item:hover,.account-item:active { background:var(--rail); }
  .account-item.active { background:var(--rail-light); }
  .account-row { display:flex; align-items:stretch; gap:5px; margin:2px 0; }
  .account-row .account-item { flex:1; min-width:0; }
  .account-delete { width:42px; flex:none; border:1px solid var(--rail-light); border-radius:9px; background:transparent; color:var(--coral); cursor:pointer; display:grid; place-items:center; }
  .account-delete:hover,.account-delete:active { background:rgba(224,108,108,.12); }
  .account-delete svg { width:17px; height:17px; }
  .account-avatar { width:34px; height:34px; border-radius:50%; background:var(--yellow); color:var(--board-deep); display:grid; place-items:center; font-weight:800; flex:none; }
  .account-name { flex:1; min-width:0; }
  .account-name strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .account-name span { display:block; font-size:11px; color:var(--chalk-dim); margin-top:2px; }
  .account-divider { height:1px; background:var(--rail); margin:6px 4px; }
  .account-backdrop { position:fixed; inset:0; z-index:999; background:transparent; }

  ::selection { background:var(--yellow); color:var(--board-deep); }
  .marks-analytics{background:var(--board-dark);border:1px solid var(--rail);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
  .marks-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px;}
  .marks-stat{background:var(--board-deep);border:1px solid var(--rail);border-radius:10px;padding:10px;text-align:center;}
  .marks-stat .v{font-size:20px;font-weight:700;color:var(--yellow);font-family:'IBM Plex Mono',monospace;}
  .marks-stat .l{font-size:10.5px;color:var(--chalk-dim);margin-top:3px;}
  .marks-lines{display:grid;gap:8px;}
  .marks-subject-lines{border-top:1px solid var(--rail);padding-top:6px;}
  .marks-line{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;padding:3px 0;color:var(--chalk-dim);font-size:12px;border-bottom:1px dashed var(--rail-light);}
  .marks-line:last-child{border-bottom:0;}
  .marks-line.subject{font-size:14px;color:var(--chalk);font-weight:700;border-bottom:1px solid var(--rail);padding-bottom:5px;}
  .marks-line.subject b{color:var(--yellow);font-family:'IBM Plex Mono',monospace;}
  .marks-line>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .marks-line>span:last-child{display:flex;align-items:center;gap:7px;flex:none;font-family:'IBM Plex Mono',monospace;}
  .marks-line b{color:var(--chalk);font-weight:700;}
  .marks-line small{color:var(--chalk-dim);font-size:10px;min-width:45px;text-align:right;}

  .marks-graph{background:var(--board-deep);border:1px solid var(--rail);border-radius:12px;padding:10px 10px 8px;overflow:hidden;}
  .marks-graph-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .marks-graph-title{font-size:14px;font-weight:700;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .marks-graph-pct{font:700 14px 'IBM Plex Mono',monospace;color:var(--yellow);flex:none;}
  .marks-graph svg{display:block;width:100%;height:150px;overflow:visible;}
  .marks-graph-grid{stroke:var(--rail-light);stroke-width:1;opacity:.65;}
  .marks-graph-line{fill:none;stroke:var(--yellow);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .marks-graph-point{fill:var(--yellow);stroke:var(--board-deep);stroke-width:2;}
  .marks-graph-label{fill:var(--chalk-dim);font-size:9px;font-family:'IBM Plex Mono',monospace;}
  .marks-graph-value{fill:var(--chalk);font-size:9px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .marks-graph-axis{fill:var(--chalk-dim);font-size:8px;font-family:'IBM Plex Mono',monospace;}
  .marks-source{font-size:11px;color:var(--chalk-dim);margin-top:10px;}
  .marks-empty{font-size:12.5px;color:var(--chalk-dim);line-height:1.5;}
  .mark-sheet-wrap{position:relative;overflow-x:auto;margin-bottom:10px;border:1px solid var(--rail);border-radius:8px;background:transparent;}
  .mark-sheet-wrap > table{position:relative;z-index:1;}
  .mark-sheet-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden;padding:0 18px;}
  .mark-sheet-watermark span{display:block;font-size:clamp(28px,8vw,64px);font-weight:900;letter-spacing:3px;line-height:1.15;white-space:nowrap;color:var(--chalk);opacity:.13;text-transform:uppercase;text-align:center;max-width:96%;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:430px){.marks-summary{grid-template-columns:1fr 1fr 1fr}.marks-row{grid-template-columns:86px 1fr 44px;gap:6px}.marks-name{font-size:10.5px}}


  .india-clock{display:inline-flex;align-items:center;gap:8px;background:var(--board-dark);border:1px solid var(--rail);border-radius:999px;padding:9px 14px;color:var(--chalk-dim);font:500 12px 'IBM Plex Mono',monospace;white-space:nowrap}
  .india-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .command-card{background:linear-gradient(135deg,#284a3a,#14271f);border:1px solid var(--rail-light);border-radius:22px;padding:28px 24px;margin:18px 0 22px;}
  .command-kicker{font-weight:700;letter-spacing:.14em;color:#9fe0bb;font-size:13px;line-height:1.7;text-transform:uppercase;max-width:170px}
  .command-title{font-family:'Kalam',cursive;font-size:43px;line-height:1.05;margin:16px 0;color:var(--chalk)}
  .command-sub{color:var(--chalk-dim);font-size:15px;line-height:1.55;max-width:260px}
  .command-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .command-stat{background:rgba(10,25,19,.5);border:1px solid var(--rail);border-radius:14px;padding:16px}
  .command-stat .v{font:700 25px 'IBM Plex Mono',monospace;color:var(--chalk)}
  .command-stat .l{font-size:12px;color:var(--chalk-dim);margin-top:5px}
  .tap-pop{transition:transform .18s ease}
  .tap-pop:active{transform:scale(.985)}
  @media(max-width:430px){.command-title{font-size:39px}.command-card{padding:24px 20px}}


  /* Floating live bunk calculator */
  #bunk-float-root{position:fixed;inset:0;z-index:9999;pointer-events:none;}
  .bunk-fab{position:fixed;width:58px;height:58px;border-radius:50%;border:1px solid var(--rail-light);background:var(--yellow);color:var(--board-deep);box-shadow:0 8px 28px rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none;z-index:10000;}
  .bunk-fab:active{cursor:grabbing;}
  .bunk-fab svg{width:26px;height:26px;pointer-events:none;}
  .bunk-fab-badge{position:absolute;right:-2px;bottom:-1px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--board-dark);border:1px solid var(--rail-light);color:var(--chalk);font:700 9px 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .bunk-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center;padding:12px;pointer-events:auto;}
  .bunk-modal{width:min(640px,100%);max-height:86vh;overflow:auto;background:radial-gradient(circle at 92% 4%,rgba(232,198,101,.12),transparent 28%),radial-gradient(circle at 5% 18%,rgba(103,211,151,.10),transparent 26%),var(--board);border:1px solid rgba(232,198,101,.28);border-radius:24px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.035);}
  .bunk-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:-16px;background:linear-gradient(180deg,var(--board) 82%,rgba(20,39,31,.88));padding:4px 0 10px;z-index:2;}
  .bunk-modal-head h2{font-family:'Kalam',cursive;font-size:27px;margin:0;letter-spacing:.01em;text-shadow:0 0 18px rgba(232,198,101,.18);}
  .bunk-modal-head p{font-size:11px;color:var(--chalk-dim);margin:2px 0 0;}
  .bunk-refresh{width:36px;height:36px;border-radius:10px;border:1px solid var(--rail);background:var(--board-dark);color:var(--chalk);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}.bunk-refresh:disabled{opacity:.55;cursor:default}.bunk-refresh.spin{animation:bunkspin .8s linear infinite}@keyframes bunkspin{to{transform:rotate(360deg)}}
  .bunk-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--rail);background:var(--board-dark);color:var(--chalk);font-size:20px;cursor:pointer;}
  .bunk-live{font:600 10px 'IBM Plex Mono',monospace;color:#07150f;background:linear-gradient(135deg,#8fe5b2,#e8c665);box-shadow:0 0 14px rgba(143,229,178,.16);padding:5px 8px;border-radius:999px;white-space:nowrap;}
  .bunk-card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(40,74,58,.92),rgba(12,31,23,.98));border:1px solid rgba(143,217,168,.22);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 10px 28px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.035);}.bunk-card:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#8fe5b2,#e8c665);}.bunk-card:after{content:'';position:absolute;width:110px;height:110px;right:-48px;top:-48px;border-radius:50%;border:1px solid rgba(232,198,101,.16);box-shadow:0 0 0 12px rgba(232,198,101,.025),0 0 0 24px rgba(143,229,178,.02);pointer-events:none;}
  .bunk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .bunk-name{font-size:15px;font-weight:700;line-height:1.3;min-width:0;position:relative;z-index:1;}.bunk-course-code{display:inline-flex;align-items:center;gap:6px;}.bunk-course-code:before{content:'◆';font-size:7px;color:#e8c665;opacity:.9;}
  .bunk-course-name{display:block;margin-top:3px;font-size:12px;font-weight:500;color:var(--chalk-dim);line-height:1.3;}
  .bunk-pct{font:700 18px 'IBM Plex Mono',monospace;color:#07150f;background:linear-gradient(135deg,#e8c665,#8fe5b2);padding:8px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 5px 16px rgba(0,0,0,.16);}
  .bunk-track{height:9px;background:rgba(7,21,15,.72);border:1px solid rgba(143,217,168,.12);border-radius:99px;overflow:hidden;margin:12px 0 5px;box-shadow:inset 0 1px 4px rgba(0,0,0,.28);}
  .bunk-fill{height:100%;background:linear-gradient(90deg,#f07878 0%,#e8c665 58%,#8fe5b2 100%);border-radius:99px;box-shadow:0 0 12px rgba(143,229,178,.28);transition:width .35s ease;}
  .bunk-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--chalk-dim);}
  .bunk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 9px;}
  .bunk-stat{background:rgba(40,74,58,.72);border:1px solid rgba(143,217,168,.12);border-radius:12px;padding:9px 8px;min-width:0;}
  .bunk-stat .k{font-size:10.5px;color:var(--chalk-dim);margin-bottom:2px;}
  .bunk-stat .v{font-size:19px;font-weight:700;color:var(--chalk);}
  .bunk-stat.present .v{color:var(--green);}.bunk-stat.absent .v{color:var(--coral);}
  .bunk-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .bunk-action{border:1px solid rgba(232,198,101,.18);border-radius:12px;background:linear-gradient(135deg,#e8c665,#d8ae4c);color:var(--board-deep);font-size:13.5px;font-weight:800;padding:10px 8px;cursor:pointer;min-height:42px;box-shadow:0 6px 18px rgba(232,198,101,.10);}.bunk-action:nth-child(2){background:linear-gradient(135deg,#8fe5b2,#62c98e);}.bunk-action:active{transform:translateY(1px) scale(.99);}
  .bunk-result{margin-top:9px;background:linear-gradient(135deg,rgba(40,74,58,.52),rgba(7,21,15,.82));border:1px solid rgba(143,217,168,.20);border-radius:13px;padding:11px 12px;font-size:12px;line-height:1.5;color:var(--chalk-dim);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);}
  .bunk-result strong{color:var(--chalk);}
  .future-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px;}
  .future-stepper{font-size:10px;color:var(--chalk-dim);}.future-controls{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:6px;margin-top:4px;border:1px solid var(--rail-light);border-radius:10px;padding:4px;background:var(--board-deep);min-height:38px;box-sizing:border-box;}.future-controls strong{font:700 17px 'IBM Plex Mono',monospace;color:var(--chalk);text-align:center;}.future-controls button{border:0;border-radius:7px;min-height:30px;font-size:20px;line-height:1;background:var(--rail);color:var(--chalk);cursor:pointer;font-weight:700;}.future-controls button:active{transform:scale(.94);}.future-controls .future-plus{background:var(--yellow);color:var(--board-deep);}

<body>
<div class="wrap">
  <header class="app-head">
    <h1>Your Term, Mapped</h1>
    <p class="sub">Classes, assignments, exams and attendance — kept in one place, saved right here in your browser.</p>
  </header>
  <nav id="tabs"></nav>
  <div id="content"></div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
</div>
<div id="bunk-float-root"></div>

<script>
const STORAGE_KEY = "student-tracker-data-v1";
const API_KEY_STORAGE = "student-tracker-gemini-key-v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_MAP = {monday:"Mon",mon:"Mon",tuesday:"Tue",tue:"Tue",tues:"Tue",wednesday:"Wed",wed:"Wed",thursday:"Thu",thu:"Thu",thurs:"Thu",friday:"Fri",fri:"Fri",saturday:"Sat",sat:"Sat",sunday:"Sun",sun:"Sun"};
const normDay = d => DAY_MAP[(d||"").toLowerCase().trim()] || d || "Mon";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let state = { timetable:[], assignments:[], exams:[], attendance:[], custom:{} };
let portalPages = {}; // NOT persisted -- always fresh from the live portal each login
let tab = "timetable";
let draft = null;      // {type, ...fields} for open add-forms
let shots = [];        // {id, dataUrl, mediaType, base64}
let review = [];       // extracted items pending confirm
let extracting = false;
let extractError = "";
let apiKey = localStorage.getItem(API_KEY_STORAGE) || "";
let showKeyInput = false;
let keySavedMsg = "";
const REMINDER_DAYS = 2; // flag assignments/exams due within this many days
const NOTIFIED_KEY = "student-tracker-notified-v1";
const BACKEND_URL = "https://srm-tracker-backend.vercel.app/api/portal-login";

let portalUsername = "";
let portalPassword = "";
let portalCaptcha = "";
let portalCaptchaImage = "";
let portalSessionCookie = "";
let portalStatus = ""; // "", "loading", "ready", "loggingin", "success", "error"
let portalMessage = "";
let loggedIn = false;
let accountMenuOpen = false;
const ACCOUNTS_KEY = "student-tracker-accounts-v1";
const ACTIVE_ACCOUNT_KEY = "student-tracker-active-account-v1";
let activeAccountKey = localStorage.getItem(ACTIVE_ACCOUNT_KEY) || "";
let accounts = {};
try { accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || "{}"); } catch(e) { accounts = {}; }

function accountKey(username){ return String(username || "").trim().toUpperCase(); }
function saveAccounts(){ try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts)); } catch(e) {} }
function accountLabel(key){ return accounts[key]?.label || accounts[key]?.username || key; }
function accountInitial(key){ return (accountLabel(key).replace(/[^a-zA-Z0-9]/g, "").slice(0,1) || "A").toUpperCase(); }
function saveCurrentAccount(){
  if(!activeAccountKey) return;
  accounts[activeAccountKey] = { ...(accounts[activeAccountKey]||{}), username: portalUsername || activeAccountKey, sessionCookie: portalSessionCookie || accounts[activeAccountKey]?.sessionCookie || "", label: accounts[activeAccountKey]?.label || portalUsername || activeAccountKey };
  saveAccounts();
  try { localStorage.setItem("student-tracker-state-"+activeAccountKey, JSON.stringify(state)); } catch(e) {}
}
function loadAccountState(key){
  try {
    const raw=localStorage.getItem("student-tracker-state-"+key);
    if(raw) state=Object.assign({ timetable:[], assignments:[], exams:[], attendance:[], custom:{} }, JSON.parse(raw));
    else state={ timetable:[], assignments:[], exams:[], attendance:[], custom:{} };
  } catch(e) {}
}
let refreshing = false;
let attendanceCode = "";
let submittingAttendance = false;
let attendanceMessage = "";
let attendanceSuccess = false;
let discovering = false;
let discoverStatus = "";
let pageLoadError = "";
let bunkOpen = {};
let bunkRefreshing = false;
let bunkRefreshMessage = "";
let futureOpen = {};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}
function getReminders() {
  const items = [];
  state.assignments.forEach(a => {
    if (a.done || !a.due) return;
    const d = daysUntil(a.due);
    if (d !== null && d <= REMINDER_DAYS) items.push({ id:"a:"+a.id, kind:"Assignment", label:a.title, sub:a.subject, days:d });
  });
  state.exams.forEach(ex => {
    if (!ex.date) return;
    const d = daysUntil(ex.date);
    if (d !== null && d <= REMINDER_DAYS) items.push({ id:"e:"+ex.id, kind:"Exam", label:ex.subject, sub:ex.room, days:d });
  });
  return items.sort((x,y)=>x.days-y.days);
}
function reminderText(item) {
  if (item.days < 0) return `overdue by ${Math.abs(item.days)} day${Math.abs(item.days)===1?"":"s"}`;
  if (item.days === 0) return "due today";
  if (item.days === 1) return "due tomorrow";
  return `due in ${item.days} days`;
}
function renderReminderBanner() {
  const items = getReminders();
  const permission = ("Notification" in window) ? Notification.permission : "unsupported";
  let html = "";
  if (items.length > 0) {
    html += `<div class="warn" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;align-items:flex-start;gap:8px;">
        ${ICONS.warn}
        <div style="flex:1;">
          <div style="font-weight:600;margin-bottom:4px;">${items.length} thing${items.length===1?"":"s"} coming up</div>
          ${items.map(it => `<div class="meta" style="color:var(--chalk);margin-bottom:2px;">${esc(it.kind)}: ${esc(it.label)}${it.sub?` (${esc(it.sub)})`:""} — <span style="color:${it.days<0?'var(--coral)':'var(--yellow)'};">${reminderText(it)}</span></div>`).join("")}
        </div>
      </div>
      ${permission==="default" ? `<button class="btn-add" style="align-self:flex-start;" onclick="enableNotifications()">${ICONS.check} Turn on notifications</button>` : ""}
      ${permission==="denied" ? `<p class="meta" style="margin:0;">Notifications are blocked in your browser settings — enable them there if you want alerts, this banner will still show either way.</p>` : ""}
    </div>`;
  }
  return html;
}
function enableNotifications() {
  if (!("Notification" in window)) return;
  Notification.requestPermission().then(() => { checkAndNotify(true); render(); });
}
function checkAndNotify(force) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let notified = {};
  try { notified = JSON.parse(localStorage.getItem(NOTIFIED_KEY) || "{}"); } catch(e) {}
  const today = todayStr();
  getReminders().forEach(item => {
    const key = item.id + ":" + today;
    if (!force && notified[key]) return;
    new Notification("Your Term, Mapped", { body: `${item.kind}: ${item.label} — ${reminderText(item)}` });
    notified[key] = true;
  });
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch(e) { /* first run */ }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { console.error("Save failed", e); }
}

const ICONS = {
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  sparkles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>',
};

const BASE_TABS = [
  {id:"myportal", label:"My Portal", icon:"folder"},
  {id:"timetable", label:"Timetable", icon:"calendar"},
  {id:"assignments", label:"Assignments", icon:"list"},
  {id:"exams", label:"Exams", icon:"cap"},
  {id:"attendance", label:"Attendance", icon:"check"},
];
function buildTabs() {
  const customTabs = Object.keys(state.custom || {}).map(cat => ({ id: "custom:"+cat, label: cat, icon: "folder" }));
  return [...BASE_TABS, ...customTabs, {id:"import", label:"AI Import", icon:"sparkles"}];
}

function renderTabs() {
  const TABS = buildTabs();
  document.getElementById("tabs").innerHTML = TABS.map(t => `
    <button data-tab="${t.id}" class="${tab===t.id?'active':''}">
      ${ICONS[t.icon]}${esc(t.label)}
    </button>
  `).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; draft=null; render(); });
}

function sectionHead(title, sub, addLabel, onAdd) {
  return `<div class="section-head">
    <div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>
    ${onAdd ? `<button class="btn-add" onclick="${onAdd}">${ICONS.plus}${esc(addLabel)}</button>` : ""}
  </div>`;
}

function renderTimetable() {
  const sorted = [...state.timetable].sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || (a.start||"").localeCompare(b.start||""));
  let html = sectionHead("Class Timetable", `${state.timetable.length} ${state.timetable.length===1?'class':'classes'} on the board`, null, null);
  if (draft && draft.type==='timetable') html += formTimetable();
  html += sorted.length===0 ? `<div class="empty">No classes yet. Add your first one to start filling in the week.</div>` :
    sorted.map(c => `
      <div class="card">
        <div class="main">
          <span class="tag">${esc(c.day)}</span>
          <div style="min-width:0;">
            <div class="title">${esc(c.subject)}</div>
            <div class="meta">${esc(c.start)}–${esc(c.end)}${c.room?` · ${esc(c.room)}`:''}</div>
          </div>
        </div>
        <button class="del" onclick="removeItem('timetable','${c.id}')">${ICONS.trash}</button>
      </div>`).join("");
  return html;
}
function formTimetable() {
  const d = draft;
  return `<div class="form">
    <div class="grid2">
      <label class="field">Day
        <select onchange="draft.day=this.value">
          ${DAYS.map(x=>`<option value="${x}" ${d.day===x?'selected':''}>${x}</option>`).join("")}
        </select>
      </label>
      <label class="field">Subject<input value="${esc(d.subject)}" oninput="draft.subject=this.value" placeholder="e.g. Linear Algebra" /></label>
      <label class="field">Start time<input type="time" value="${esc(d.start)}" oninput="draft.start=this.value" /></label>
      <label class="field">End time<input type="time" value="${esc(d.end)}" oninput="draft.end=this.value" /></label>
      <label class="field">Room / link<input value="${esc(d.room)}" oninput="draft.room=this.value" placeholder="e.g. Block C-204" /></label>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
      <button class="btn-save" onclick="saveTimetable()">Save</button>
    </div>
  </div>`;
}
function saveTimetable(){
  if (!draft.subject) return cancelForm();
  state.timetable.push({id:uid(), day:draft.day||"Mon", start:draft.start||"", end:draft.end||"", subject:draft.subject, room:draft.room||""});
  save(); cancelForm();
}

function renderAssignments() {
  const pending = state.assignments.filter(a=>!a.done).length;
  let html = sectionHead("Assignments", `${pending} pending`, null, null);
  if (draft && draft.type==='assignments') html += formAssignment();
  const sorted = [...state.assignments].sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  html += sorted.length===0 ? `<div class="empty">Nothing tracked yet. Add a deadline before it sneaks up on you.</div>` :
    sorted.map(a=>`
      <div class="card">
        <div class="main">
          <button class="check-btn ${a.done?'done':''}" onclick="toggleDone('${a.id}')">${a.done?ICONS.check.replace('viewBox="0 0 24 24"','width="12" height="12" viewBox="0 0 24 24"'):''}</button>
          <div style="min-width:0;">
            <div class="title" style="${a.done?'text-decoration:line-through;opacity:.5;':''}">${esc(a.title)}</div>
            <div class="meta">${esc(a.subject)}${a.due?` · due ${esc(a.due)}`:''}</div>
          </div>
        </div>
        <button class="del" onclick="removeItem('assignments','${a.id}')">${ICONS.trash}</button>
      </div>`).join("");
  return html;
}
function formAssignment(){
  const d = draft;
  return `<div class="form">
    <div class="grid2">
      <label class="field">Title<input value="${esc(d.title)}" oninput="draft.title=this.value" placeholder="e.g. Lab report 3" /></label>
      <label class="field">Subject<input value="${esc(d.subject)}" oninput="draft.subject=this.value" placeholder="e.g. Physics" /></label>
      <label class="field">Due date<input type="date" value="${esc(d.due)}" oninput="draft.due=this.value" /></label>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
      <button class="btn-save" onclick="saveAssignment()">Save</button>
    </div>
  </div>`;
}
function saveAssignment(){
  if (!draft.title) return cancelForm();
  state.assignments.push({id:uid(), title:draft.title, subject:draft.subject||"", due:draft.due||"", done:false});
  save(); cancelForm();
}
function toggleDone(id){ const a=state.assignments.find(x=>x.id===id); if(a){a.done=!a.done; save(); render();} }

function renderExams() {
  let html = sectionHead("Exam Schedule", `${state.exams.length} upcoming`, null, null);
  if (draft && draft.type==='exams') html += formExam();
  const sorted = [...state.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  html += sorted.length===0 ? `<div class="empty">No exams logged yet.</div>` :
    sorted.map(ex=>`
      <div class="card">
        <div>
          <div class="title">${esc(ex.subject)}</div>
          <div class="meta">${esc(ex.date)}${ex.time?` · ${esc(ex.time)}`:''}${ex.room?` · ${esc(ex.room)}`:''}</div>
        </div>
        <button class="del" onclick="removeItem('exams','${ex.id}')">${ICONS.trash}</button>
      </div>`).join("");
  return html;
}
function formExam(){
  const d = draft;
  return `<div class="form">
    <div class="grid2">
      <label class="field">Subject<input value="${esc(d.subject)}" oninput="draft.subject=this.value" placeholder="e.g. Organic Chemistry" /></label>
      <label class="field">Room / hall<input value="${esc(d.room)}" oninput="draft.room=this.value" placeholder="e.g. Hall 2" /></label>
      <label class="field">Date<input type="date" value="${esc(d.date)}" oninput="draft.date=this.value" /></label>
      <label class="field">Time<input type="time" value="${esc(d.time)}" oninput="draft.time=this.value" /></label>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
      <button class="btn-save" onclick="saveExam()">Save</button>
    </div>
  </div>`;
}
function saveExam(){
  if (!draft.subject) return cancelForm();
  state.exams.push({id:uid(), subject:draft.subject, date:draft.date||"", time:draft.time||"", room:draft.room||""});
  save(); cancelForm();
}

function renderAttendance() {
  let html = sectionHead("Attendance", "Tap present or absent after each class", null, null);
  if (draft && draft.type==='attendance') html += formAttendance();
  html += state.attendance.length===0 ? `<div class="empty">Add a subject to start tracking how many classes you've made.</div>` :
    state.attendance.map(a=>{
      const pct = a.total ? Math.round((a.present/a.total)*100) : 0;
      const ok = pct >= 75;
      const color = ok ? 'var(--green)' : 'var(--coral)';
      return `<div class="card" style="display:block;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <span class="title">${esc(a.subject)}</span>
          <span class="meta" style="color:${color};font-weight:600;">${pct}% (${a.present}/${a.total})</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="att-actions">
          <button style="color:var(--green);" onclick="markAttendance('${a.id}', true)">Present</button>
          <button style="color:var(--coral);" onclick="markAttendance('${a.id}', false)">Absent</button>
          <button class="del" style="float:right;" onclick="removeItem('attendance','${a.id}')">${ICONS.trash}</button>
        </div>
      </div>`;
    }).join("");
  return html;
}
function formAttendance(){
  return `<div class="form">
    <label class="field">Subject<input value="${esc(draft.subject)}" oninput="draft.subject=this.value" placeholder="e.g. Data Structures" /></label>
    <div class="form-actions">
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
      <button class="btn-save" onclick="saveAttendanceSubject()">Save</button>
    </div>
  </div>`;
}
function saveAttendanceSubject(){
  if (!draft.subject) return cancelForm();
  state.attendance.push({id:uid(), subject:draft.subject, present:0, total:0});
  save(); cancelForm();
}
function markAttendance(id, present){
  const a = state.attendance.find(x=>x.id===id);
  if (a){ a.total+=1; if(present) a.present+=1; save(); render(); }

async function startPortalLogin() {
  portalStatus = "loading";
  portalMessage = "";
  portalCaptchaImage = "";
  portalCaptcha = "";
  render();
  try {
    const res = await fetch(`${BACKEND_URL}?step=start`);
    const data = await res.json();
    if (data.error) {
      portalStatus = "error";
      portalMessage = data.error;
    } else {
      portalSessionCookie = data.sessionCookie || "";
      portalCaptchaImage = data.captchaImage || "";
      portalCaptcha = data.captchaText || ""; // auto fill captcha
      portalStatus = "ready";
    }
  } catch (e) {
    portalStatus = "error";
    portalMessage = "Couldn't reach the backend: " + e.message;
  }
  render();
  if (portalStatus === "ready") autoSubmitPortalLogin();
}

async function autoSubmitPortalLogin(){
  await new Promise(r=>setTimeout(r,350));
  const userEl=document.querySelector('input[placeholder="e.g. AP2511XXXXXX"]');
  const passEl=document.querySelector('input[placeholder="Your portal password"]');
  if(userEl && userEl.value) portalUsername=userEl.value.trim();
  if(passEl && passEl.value) portalPassword=passEl.value;
  if(portalUsername && portalPassword && portalCaptcha) await submitPortalLogin();
}

async function submitPortalLogin() {
  if (!portalUsername || !portalPassword || !portalCaptcha) {
    portalMessage = "Fill in your registration number, password, and the captcha text.";
    render();
    return;
  }
  portalStatus = "loggingin";
  portalMessage = "";
  render();
  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        step: "login",
        username: portalUsername,
        password: portalPassword,
        captcha: portalCaptcha,
        sessionCookie: portalSessionCookie,
      }),
    });
    const data = await res.json();
    if (data.error) {
      portalStatus = "error";
      portalMessage = data.error + (data.debugStatus ? ` (status ${data.debugStatus})` : "");
      startPortalLogin(); // captcha is single-use, load a fresh one for the retry
      return;
    }
    portalSessionCookie = data.sessionCookie || portalSessionCookie;
    portalStatus = "success";
    portalMessage = "";
    loggedIn = true;
    activeAccountKey = accountKey(portalUsername);
    accounts[activeAccountKey] = { username: portalUsername, label: portalUsername, sessionCookie: portalSessionCookie };
    saveAccounts();
    try { localStorage.setItem(ACTIVE_ACCOUNT_KEY, activeAccountKey); } catch(e) {}
    loadAccountState(activeAccountKey);
    tab = "myportal";
    refreshPortalData();
  } catch (e) {
    portalStatus = "error";
    portalMessage = "Something went wrong: " + e.message;
    render();
  }
}

async function refreshPortalData() {
  refreshing = true;
  portalMessage = "";
  render();
  await refreshAllPortalPages();
  portalMessage = Object.keys(portalPages).length
    ? "Refreshed your connected sections."
    : "Logged in. Tap 'Discover & load everything' under My Portal.";
  refreshing = false;
  render();
}

  portalCaptchaImage = "";
  portalSessionCookie = "";
  portalStatus = "";
  portalMessage = "";
  portalPages = {};

  startPortalLogin();
}

function cleanMarkNumber(value){
  const s = String(value ?? "").trim();
  if (!s || /^(na|n\/a|-|absent|ab)$/i.test(s)) return null;
  const ratio = s.match(/(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
  if (ratio) return {score:Number(ratio[1]), max:Number(ratio[2]), pct:Number(ratio[1])/Number(ratio[2])*100};
  const pct = s.match(/^(-?\d+(?:\.\d+)?)\s*%$/);
  if (pct) return {score:Number(pct[1]), max:100, pct:Number(pct[1])};
  if (/^-?\d+(?:\.\d+)?$/.test(s)) return {score:Number(s), max:null, pct:null};
  return null;
}

function headerMax(header){
  const s=String(header||"");
  const m=s.match(/(?:out\s*of|\/|max(?:imum)?|total)\s*[:=]?\s*(\d+(?:\.\d+)?)/i);
  return m ? Number(m[1]) : null;
}

function extractMarksAnalytics(){
  // SRM Internal Marks is structured differently from a normal subject-wise
  // table: EACH SUBJECT is represented by its own mark-sheet table. The table
  // header is typically "Name" + "Mark Secured(Conducted)" and the rows are
  // assessment components such as Mid Semester, CLA 1, CLA 2, Lab Performance.
  // Therefore we must NOT look for a subject name inside each row.
  const pages=getMarksPortalPages();
  const attendance=liveAttendanceStats();
  const subjectPool=(attendance.rows||[]).map(r=>({name:r.name}));
  const rows=[];
  let detectedSheets=0;

  function norm(v){ return String(v??'').replace(/\s+/g,' ').trim(); }
  function isMarkSheetHeader(header){
    const h=header.map(x=>norm(x).toLowerCase());
    const hasName=h.some(x=>/^(name|assessment|component|particulars?)$/.test(x));
    const hasSecured=h.some(x=>/mark\s*secured\s*\(?\s*conducted\s*\)?|marks?\s*secured.*conducted|secured.*conducted/i.test(x));
    const hasMark=h.some(x=>/mark|score|obtained|conducted|internal|assessment/i.test(x));
    return hasName && (hasSecured || hasMark);
  }
  function findSecuredColumn(header){
    const exact=header.findIndex(x=>/mark\s*secured\s*\(?\s*conducted\s*\)?|marks?\s*secured.*conducted|secured.*conducted/i.test(norm(x)));
    if(exact>=0) return exact;
    return header.findIndex(x=>/mark\s*secured|obtained|score/i.test(norm(x)));
  }

  pages.forEach(page=>{
    (page.tables||[]).forEach(table=>{
      if(!Array.isArray(table)||table.length<2) return;
      const header=(table[0]||[]).map(norm);
      if(!isMarkSheetHeader(header)) return;

      const securedIdx=findSecuredColumn(header);
      if(securedIdx<0) return;

      const entries=[];
      for(let r=1;r<table.length;r++){
        const cells=(table[r]||[]).map(norm);
        if(!cells.length) continue;
        const component=cells[0]||'';
        // Ignore rows which are clearly headers/labels rather than assessment data.
        if(!component || /^(name|mark secured|total|percentage|assessment|component)$/i.test(component)) continue;

        let parsed=cleanMarkNumber(cells[securedIdx]);
        if(!parsed){
          // Some portal variants expose the secured/conducted value in another
          // mark column. Only accept an explicit ratio/percentage/number here.
          for(let i=0;i<cells.length;i++){
            if(i===0) continue;
            const candidate=cleanMarkNumber(cells[i]);
            if(candidate && (candidate.max!=null || /mark|score|obtained|conducted/i.test(header[i]||''))){
              parsed=candidate;
              break;
            }
          }
        }
        if(!parsed) continue;

        // If the portal gives a bare secured number but the header contains the
        // conducted maximum, recover the maximum from that header.
        if(parsed.max==null){
          const max=headerMax(header[securedIdx]);
          if(max!=null){ parsed.max=max; parsed.pct=parsed.score/max*100; }
        }
        if(parsed.max==null || !Number.isFinite(parsed.pct)) continue;
        if(parsed.score<0 || parsed.max<=0 || parsed.score>parsed.max) continue;
        entries.push({score:parsed.score,max:parsed.max,pct:parsed.pct,component});
      }

      if(!entries.length) return;
      detectedSheets++;
      rows.push({
        name:'',
        entries,
        page:page.label||page.title||'Internal Marks',
        sheetIndex:detectedSheets-1
      });
    });
  });

  // SRM presents the subject mark sheets in the same subject sequence as the
  // Attendance Details page. Use those live attendance subject names as the
  // canonical names instead of guessing from assessment rows like "CLA 1".
  rows.forEach((sheet,i)=>{
    sheet.name=subjectPool[i]?.name || '';
  });

  // If the portal exposed fewer attendance names than mark sheets, do not invent
  // names. Keep only sheets that can be tied to a real live subject.
  const validRows=rows.filter(x=>x.name);
  validRows.forEach(x=>{
    const totalScore=x.entries.reduce((a,e)=>a+e.score,0);
    const totalMax=x.entries.reduce((a,e)=>a+e.max,0);
    x.totalScore=totalScore;
    x.totalMax=totalMax;
    x.avgPct=totalMax>0 ? (totalScore/totalMax)*100 : null;
    x.count=x.entries.length;
  });

  validRows.sort((a,b)=>(b.avgPct??-Infinity)-(a.avgPct??-Infinity));
  return {rows:validRows,pages,sheetsDetected:detectedSheets,subjectsAvailable:subjectPool.length};
}

function renderMarksAnalytics(){
  const data=extractMarksAnalytics();
  if(!data.pages.length) return "";
  if(!data.rows.length) return `<div class="marks-analytics"><div style="font-weight:600;margin-bottom:4px;">Academic Performance</div><div class="marks-empty">Internal Marks loaded, but no valid subject mark sheets were detected yet. Refresh the Internal Marks section after the portal finishes loading.</div></div>`;

  const rows=data.rows.filter(x=>x.entries && x.entries.length && x.avgPct!=null);
  if(!rows.length) return `<div class="marks-analytics"><div style="font-weight:600;margin-bottom:4px;">Academic Performance</div><div class="marks-empty">Mark sheets were found, but no valid secured/conducted marks could be calculated yet.</div></div>`;

  const highest=Math.max(...rows.map(x=>x.avgPct));
  const average=rows.reduce((a,x)=>a+x.avgPct,0)/rows.length;
  const fmt=n=>Number.isInteger(n)?String(n):Number(n).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');

  // Compact line-only view: every detected assessment remains visible, but
  // without graphs/cards that consume vertical space on a phone.
  return `<div class="marks-analytics">
    <div class="section-head" style="margin-bottom:4px;">
      <div><h2 style="font-size:22px;">Academic Performance</h2><p>All detected internal marks</p></div>
    </div>
    <div class="marks-summary">
      <div class="marks-stat"><div class="v">${average.toFixed(2)}%</div><div class="l">Average</div></div>
      <div class="marks-stat"><div class="v">${highest.toFixed(2)}%</div><div class="l">Highest</div></div>
      <div class="marks-stat"><div class="v">${rows.length}</div><div class="l">Subjects</div></div>
    </div>
    <div class="marks-lines">
      ${rows.map(x=>`<div class="marks-subject-lines">
        <div class="marks-line subject"><span>${esc(x.name)}</span><b>${x.avgPct.toFixed(2)}%</b></div>
        ${x.entries.map(e=>`<div class="marks-line"><span>${esc(e.component)}</span><span><b>${fmt(e.score)} / ${fmt(e.max)}</b><small>${e.pct.toFixed(2)}%</small></span></div>`).join('')}
      </div>`).join('')}
    </div>
    <div class="marks-source">Source: ${esc(data.pages.map(p=>p.label||p.title).join(", "))}. Every line represents a detected secured/conducted mark.</div>
  </div>`;
}

function getMarkSubjectNames(page){
  // Prefer course-code-like headings from the portal text when the portal
  // supplies them outside the actual marks tables.
  const names=[];
  const text=String(page?.text||'');
  text.split(/\r?\n|\s{2,}/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const clean=line.replace(/\s+/g,' ').trim();
    if(clean.length<2 || clean.length>80) return;
    if(/^(internal marks?|name|mark secured|mark|conducted|total|obtained|assessment|mid semester|model exam|observation note|lab performance|cla \d+)$/i.test(clean)) return;
    if(/^[A-Z]{2,6}\s*[-/]?\s*\d{2,4}(?:\s*[-:]\s*.*)?$/i.test(clean)) names.push(clean);
  });
  return [...new Set(names)];
}

function markWatermarkName(page, tableIndex){
  // The marks tables themselves often contain only assessment names
  // (Mid Semester, CLA, Lab Performance, etc.). The actual subject name
  // comes from the live Attendance table, where SRM exposes the course name.
  try {
    const live=liveAttendanceStats();
    if(live.rows && live.rows[tableIndex]?.name) return live.rows[tableIndex].name;
  } catch(e) {}

  // If Attendance is unavailable, use explicit course-code headings from
  // the same portal page, but never use assessment-row names as a subject.
  const textNames=getMarkSubjectNames(page);
  if(textNames[tableIndex]) return textNames[tableIndex];
  return '';
}

async function refreshSection(key) {
  const page = portalPages[key];
  if (!page) return;
  refreshingKeys[key] = true;
  render();
  try {

    portalPages[key] = { ...page, title: pageData.title, tables: pageData.tables, text: pageData.text };
  } catch (e) {
    // keep old data on failure rather than wiping it
  }
  delete refreshingKeys[key];
  render();
}

async function discoverAndFetchAll() {
  discovering = true;
  pageLoadError = "";
  discoverStatus = "Loading your real portal sections…";
  portalPages = {}; // always start clean -- never show data from a previous login
  render();
  try {
    let done = 0;
    for (const link of KNOWN_SECTIONS) {
      discoverStatus = `Loading ${link.label}… (${done+1}/${KNOWN_SECTIONS.length})`;
      render();
      try {
        const pageData = await fetchPortalPage(link.url, link.postBody);
        const hasTables = pageData.tables && pageData.tables.length;
        const hasText = pageData.text && pageData.text.trim().length > 0;
        const key = link.url + (link.postBody ? "?" + link.postBody : "");
        if (hasTables || hasText) {
          portalPages[key] = { label: link.label, group: link.group || groupForLabel(link.label), title: pageData.title, tables: pageData.tables, text: pageData.text, url: link.url, postBody: link.postBody };
        }
      } catch (e) {
        // skip pages that fail rather than stopping everything
      }
      done++;
    }
    save();
  } catch (e) {
    pageLoadError = "Couldn't discover sections: " + e.message;
  }
  discovering = false;
  render();
}

async function extractFromShots(){
  if (!shots.length) return;
  if (!apiKey) {
    extractError = "Add your free Google AI Studio API key above first, then tap Save key.";
    render();
    return;
  }
  extracting = true; extractError=""; review=[]; render();
  try {
    const promptText =
      "These are screenshots from a student portal. They may show a class timetable, assignments, exams, attendance, " +
      "grades/results, fees/payments, notices/announcements, faculty contacts, or any other student information. " +
      "Extract EVERY piece of information visible — not just timetable or exam entries. " +
      "Return ONLY a JSON array (no markdown fences, no commentary). Use these exact shapes when the content matches:\n" +
      '{"kind":"timetable","day":"Mon".."Sun","start":"HH:MM","end":"HH:MM","subject":"...","room":"..."}\n' +
      '{"kind":"assignment","title":"...","subject":"...","due":"YYYY-MM-DD"}\n' +
      '{"kind":"exam","subject":"...","date":"YYYY-MM-DD","time":"HH:MM","room":"..."}\n' +
      "For anything else (grades, fees, notices, results, contacts, announcements, or any other data), use:\n" +
      '{"kind":"other","category":"short label such as Grades, Fees, Notices, or Contacts","fields":{"Field name":"value"}}\n' +
      "Use the same category label consistently so related items group together. " +
      "Use empty string for any field you cannot read. If you genuinely cannot find any relevant information, return [].";

    const parts = [
      { text: promptText },
      ...shots.map(s => ({ inline_data: { mime_type: s.mediaType, data: s.base64 } }))
    ];

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts }] })
      }
    );
    const data = await response.json();
    if (data.error) {
      extractError = "Gemini API error: " + (data.error.message || "check that your key is correct.");
      return;
    }
    const text = ((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    const clean = text.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    if (!Array.isArray(parsed) || parsed.length===0) {
      extractError = "Couldn't find any readable details in those images. Try a clearer or less cropped screenshot.";
    } else {
      review = parsed.map(item => ({id:uid(), selected:true, ...item}));
    }
  } catch(e) {
    extractError = "Something went wrong reaching the API. Check your internet connection and that your key is correct.";
  } finally {
    extracting = false; render();
  }
}

function liveAttendanceStats(){
  // Use ONLY the actual SRM Attendance subject table.
  // SRM's live attendance table reports:
  //   Classes Conducted = TOTAL
  //   Attendance Entered (Slots) = PRESENT
  //   Attendance Not Entered (Slots) = ABSENT
  // We deliberately require all three columns so unrelated tables/text on the
  // Attendance page cannot create a fake "Least attendance" value.
  const pages=Object.values(portalPages||{});
  const page=pages.find(p=>String(p?.label||'').trim().toLowerCase()==='attendance')
    || pages.find(p=>/^(?!today'?s?\s+attendance$).*attendance/i.test(String(p?.label||'').trim()));
  if(!page || !Array.isArray(page.tables)) return {avg:null,highest:null,lowest:null,count:0,source:false,rows:[]};

  const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
  const num=v=>{const m=clean(v).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null;};
  const records=[];

  for(const table of page.tables){
    if(!Array.isArray(table)||table.length<2) continue;
    const header=(table[0]||[]).map(clean);
    const h=header.map(x=>x.toLowerCase());

    // Match the three actual SRM attendance columns. Do NOT use generic
    // "total"/"present" heuristics here because the page can contain other
    // tables whose numbers have nothing to do with attendance.
    const totalIdx=h.findIndex(x=>/classes\s*conducted|conducted\s*classes/i.test(x));
    const presentIdx=h.findIndex(x=>/attendance\s*entered|entered\s*\(?slots?\)?/i.test(x));
    const absentIdx=h.findIndex(x=>/attendance\s*not\s*entered|not\s*entered/i.test(x));
    if(totalIdx<0 || presentIdx<0 || absentIdx<0) continue;

    // Subject is normally the first descriptive column. If a subject/course
    // header exists, prefer it; otherwise use the first non-numeric cell.
    let subjectIdx=h.findIndex(x=>/subject|course\s*(name|title)?|paper\s*(name|title)?/i.test(x));
    if(subjectIdx<0){
      subjectIdx=header.findIndex((x,i)=>i!==totalIdx&&i!==presentIdx&&i!==absentIdx&&x && !/s\.?no\.?|serial|sl\.?\s*no/i.test(x));
    }

    for(let r=1;r<table.length;r++){
      const cells=(table[r]||[]).map(clean);
      if(!cells.length || cells.every(x=>!x)) continue;

      const total=num(cells[totalIdx]);
      const present=num(cells[presentIdx]);
      const absent=num(cells[absentIdx]);
      if(!Number.isFinite(total)||!Number.isFinite(present)||!Number.isFinite(absent)) continue;
      if(total<=0 || present<0 || absent<0 || present>total) continue;
      // This is the strongest guard against unrelated numeric tables.
      if(Math.abs((present+absent)-total)>1e-9) continue;

      let name=subjectIdx>=0?clean(cells[subjectIdx]):'';
      if(!name){
        name=cells.find((x,i)=>i!==totalIdx&&i!==presentIdx&&i!==absentIdx&&x && !/^[-+]?\d+(?:\.\d+)?(?:\s*\/\s*[-+]?\d+(?:\.\d+)?)?%?$/.test(x))||'';
      }
      name=clean(name);
      if(!name || /^(attendance|today'?s\s*attendance|subject|course|name|s\.?no\.?|serial|code|total|present|absent|percentage|%|remarks?)$/i.test(name)) continue;

      records.push({name,pct:(present/total)*100,present,total,absent});
    }
  }

  // If the portal repeats the same subject row, keep one real attendance row.
  // Prefer the row with the largest conducted-class count; that avoids an
  // old/partial duplicate masking the current subject attendance.
  const byName=new Map();
  for(const r of records){
    const key=r.name.toLowerCase().replace(/\s+/g,' ').trim();
    const old=byName.get(key);
    if(!old || r.total>old.total) byName.set(key,r);
  }
  const rows=[...byName.values()];
  if(!rows.length) return {avg:null,highest:null,lowest:null,count:0,source:true,rows:[]};

  const avg=rows.reduce((sum,x)=>sum+x.pct,0)/rows.length;
  const highest=rows.reduce((a,x)=>x.pct>a.pct?x:a);
  const lowest=rows.reduce((a,x)=>x.pct<a.pct?x:a);
  return {avg,highest,lowest,count:rows.length,source:true,rows};
}

function getLiveCourseNameMap(){
  const map={};
  const pages=Object.values(portalPages||{});
  const page=pages.find(p=>String(p?.label||'').trim().toLowerCase()==='subjects')
    || pages.find(p=>/subject/i.test(String(p?.label||p?.title||'')));
  if(!page) return map;
  const norm=v=>String(v??'').replace(/\s+/g,' ').trim();
  const codeRe=/^[A-Z]{2,8}\s*[-/]?\s*\d{2,4}$/i;
  const cleanCode=v=>norm(v).replace(/\s*[-/]\s*/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  const bad=/^(course\s*(code|name)?|subject|subject\s*name|name|code|s\.?no\.?|serial|sl\.?\s*no\.?|credits?|type|category|semester)$/i;
  for(const table of (page.tables||[])){
    if(!Array.isArray(table)||table.length<2) continue;
    const header=(table[0]||[]).map(norm);
    const lower=header.map(x=>x.toLowerCase());
    let codeIdx=lower.findIndex(x=>/course\s*code|subject\s*code|paper\s*code|^code$/.test(x));
    let nameIdx=lower.findIndex(x=>/course\s*(name|title)|subject\s*(name|title)|paper\s*(name|title)|^subject$/.test(x));
    for(let r=1;r<table.length;r++){
      const cells=(table[r]||[]).map(norm);
      if(!cells.length) continue;
      let code=codeIdx>=0?cleanCode(cells[codeIdx]):'';
      if(!code || !codeRe.test(code)){
        const c=cells.find(x=>codeRe.test(cleanCode(x)));
        code=c?cleanCode(c):'';
      }
      if(!code) continue;
      let name=nameIdx>=0?norm(cells[nameIdx]):'';
      if(!name || bad.test(name) || codeRe.test(name)){
        name=cells.find(x=>x && !codeRe.test(cleanCode(x)) && !bad.test(x) && !/^[-+]?\d+(?:\.\d+)?$/.test(x));
      }
      if(name) map[code]=name;
    }
  }
  // A few portal responses expose the subject list only as text.
  if(typeof page.text==='string'){
    const lines=page.text.split(/\r?\n/).map(norm).filter(Boolean);
    for(let i=0;i<lines.length;i++){
      const code=cleanCode(lines[i]);
      if(!codeRe.test(code)) continue;
      const next=lines[i+1];
      if(next && !bad.test(next) && !codeRe.test(cleanCode(next)) && !/^[-+]?\d+(?:\.\d+)?$/.test(next)) map[code]=next;
    }
  }
  return map;
}
function displayBunkSubject(row, subjectMap){
  const raw=String(row?.name||'').replace(/\s+/g,' ').trim();
  const code=raw.match(/^[A-Z]{2,8}\s*[-/]?\s*\d{2,4}$/i)?.[0]||raw;
  const key=code.replace(/\s*[-/]\s*/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  const name=subjectMap[key]||subjectMap[raw.toUpperCase()]||'';
  return {code,name:name&&name.toUpperCase()!==key?name:''};
}

function bunkKey(row){ return slugify(row.name)+'-'+String(row.pct).replace(/\./g,'_'); }
function maxSafeBunks(row,minPct=75){
  if(!Number.isFinite(row.present)||!Number.isFinite(row.total)||row.total<=0) return null;
  return Math.max(0,Math.floor(row.present/(minPct/100)-row.total+1e-9));
}
function classesNeededToReach(row,minPct=75){
  if(!Number.isFinite(row.present)||!Number.isFinite(row.total)||row.total<=0) return null;
  if(row.present/row.total>=minPct/100) return 0;
  return Math.ceil(((minPct/100)*row.total-row.present)/(1-minPct/100)-1e-9);
}
function futureAttendance(row,attend,skip){
  if(!Number.isFinite(row.present)||!Number.isFinite(row.total)||row.total<=0) return null;
  const a=Math.max(0,Math.floor(Number(attend)||0)),s=Math.max(0,Math.floor(Number(skip)||0));
  return ((row.present+a)/(row.total+a+s))*100;
}
async function refreshBunkAttendance(){
  if(bunkRefreshing) return;
  const entries=Object.entries(portalPages||{});
  const found=entries.find(([k,p])=>String(p?.label||"").trim().toLowerCase()==="attendance")
    || entries.find(([k,p])=>/^(?!today'?s\s+attendance$).*attendance/i.test(String(p?.label||"").trim()));
  if(!found){
    bunkRefreshMessage="Live Attendance section is not loaded yet. Refresh the connected Attendance section first.";
    renderBunkFloat();
    return;
  }
  const [key,page]=found;
  bunkRefreshing=true;
  bunkRefreshMessage="";
  renderBunkFloat();
  try{
    const pageData=await fetchPortalPage(page.url,page.postBody);
    portalPages[key]={...page,title:pageData.title,tables:pageData.tables,text:pageData.text};
    save();
    bunkRefreshMessage="Attendance data refreshed just now.";
  }catch(e){
    bunkRefreshMessage="Couldn’t refresh Attendance: "+(e?.message||"Unknown error");
  }finally{
    bunkRefreshing=false;
    renderBunkFloat();
  }
}
function toggleBunkPlan(key){bunkOpen[key]=!bunkOpen[key];renderBunkFloat();}
function toggleFuturePlan(key){futureOpen[key]=!futureOpen[key];renderBunkFloat();}
function futureBunkStatus(row,attend,skip,minPct=75){
  if(!Number.isFinite(row?.present)||!Number.isFinite(row?.total)||row.total<=0) return null;
  const a=Math.max(0,Math.floor(Number(attend)||0));
  const s=Math.max(0,Math.floor(Number(skip)||0));
  const present=row.present+a;
  const total=row.total+a+s;
  const pct=(present/total)*100;
  const projected={present,total,pct,absent:total-present};
  if(pct>=minPct){
    const safe=Math.max(0,Math.floor(present/(minPct/100)-total+1e-9));
    return {projected,safe,need:0,ok:true};
  }
  const need=Math.ceil(((minPct/100)*total-present)/(1-minPct/100)-1e-9);
  return {projected,safe:0,need:Math.max(0,need),ok:false};
}
function futureStatusHTML(row,attend,skip){
  const st=futureBunkStatus(row,attend,skip);
  if(!st) return '<div class="future-bunk-status">Future bunk status unavailable.</div>';
  if(st.ok){
    return `<div class="future-bunk-status future-bunk-ok"><strong>✓ ${st.safe>0?`You can skip ${st.safe} more class${st.safe===1?'':'es'}`:'No more bunks'}</strong> while staying at or above 75%.<br><span>Projected attendance: ${st.projected.pct.toFixed(2)}%</span></div>`;
  }
  return `<div class="future-bunk-status future-bunk-no"><strong>✕ No bunks after this plan.</strong><br>Projected attendance: ${st.projected.pct.toFixed(2)}%. Attend the next <strong>${st.need}</strong> class${st.need===1?'':'es'} to reach 75%.</div>`;
}
function updateFuturePreview(key,attend,skip){
  const row=(liveAttendanceStats().rows||[]).find(r=>bunkKey(r)===key); if(!row)return;
  const a=Math.max(0,Math.floor(Number(attend)||0));
  const s=Math.max(0,Math.floor(Number(skip)||0));
  const pct=futureAttendance(row,a,s); const out=document.getElementById('future-'+key); const note=document.getElementById('future-note-'+key); const status=document.getElementById('future-status-'+key);
  const attendValue=document.getElementById('attend-value-'+key), skipValue=document.getElementById('skip-value-'+key);
  if(attendValue)attendValue.textContent=a;
  if(skipValue)skipValue.textContent=s;
  if(out)out.textContent=pct==null?'—':pct.toFixed(2)+'%';
  if(note)note.textContent=pct==null?'Future attendance unavailable.':`After those future classes, your attendance would be ${pct.toFixed(2)}%.`;
  if(status)status.innerHTML=futureStatusHTML(row,a,s);
}
function changeFutureCount(key,type,delta){
  const el=document.getElementById((type==='attend'?'attend-value-':'skip-value-')+key);
  if(!el)return;
  const current=Math.max(0,Math.floor(Number(el.textContent)||0));
  const next=Math.max(0,current+(Number(delta)||0));
  const other=document.getElementById((type==='attend'?'skip-value-':'attend-value-')+key);
  const attend=type==='attend'?next:Math.max(0,Math.floor(Number(other?.textContent)||0));
  const skip=type==='skip'?next:Math.max(0,Math.floor(Number(other?.textContent)||0));
  updateFuturePreview(key,attend,skip);
}
function closeBunkCalculator(){const root=document.getElementById('bunk-float-root');if(root)root.dataset.open='0';renderBunkFloat();}
function renderBunkCalculatorModal(){
  const data=liveAttendanceStats(),rows=data.rows||[];
  const subjectMap=getLiveCourseNameMap();
  let html=`<div class="bunk-modal-backdrop" onclick="if(event.target===this)closeBunkCalculator()"><div class="bunk-modal">
    <div class="bunk-modal-head"><div><h2>Bunk Calculator</h2><p>Calculated from your live SRM Attendance table · <span class="bunk-live">LIVE DATA</span></p></div><div style="display:flex;gap:6px;align-items:center"><button class="bunk-refresh${bunkRefreshing?' spin':''}" onclick="refreshBunkAttendance()" ${bunkRefreshing?'disabled':''} aria-label="Refresh live attendance" title="Refresh live attendance">↻</button><button class="bunk-close" onclick="closeBunkCalculator()" aria-label="Close">×</button></div></div>`;
  html+=`<div class="bunk-hero"><div class="bunk-hero-title">⚡ Live Bunk Command Center</div><div class="bunk-hero-copy">Know exactly what you can miss, what you must attend, and where your 75% safety line sits.</div><div class="bunk-legend"><span class="safe">● SAFE</span><span class="target">● 75% TARGET</span><span class="danger">● AT RISK</span></div></div>`;
  if(bunkRefreshMessage){html+=`<div class="bunk-result"><strong>${esc(bunkRefreshMessage)}</strong></div>`;}
  if(!rows.length){html+=`<div class="bunk-result"><strong>No live attendance rows found.</strong><br>Refresh the connected SRM Attendance section first.</div>`;}
  rows.forEach(row=>{
    const key=bunkKey(row),pct=row.pct,canSkip=maxSafeBunks(row),absent=row.absent??(row.total-row.present);
    const subject=displayBunkSubject(row,subjectMap);
    html+=`<div class="bunk-card"><div class="bunk-top"><div class="bunk-name"><span class="bunk-course-code">${esc(subject.code)}</span>${subject.name?`<span class="bunk-course-name">${esc(subject.name)}</span>`:''}</div><div class="bunk-pct">${pct.toFixed(2)}%</div></div>
      <div class="bunk-track"><div class="bunk-fill" style="width:${Math.min(100,Math.max(0,pct))}%"></div></div>
      <div class="bunk-scale"><span>Min: 75%</span><span>Current: ${pct.toFixed(2)}%</span></div>
      <div class="bunk-stats"><div class="bunk-stat present"><div class="k">Present</div><div class="v">${row.present??'—'}</div></div><div class="bunk-stat absent"><div class="k">Absent</div><div class="v">${absent??'—'}</div></div><div class="bunk-stat"><div class="k">Total</div><div class="v">${row.total??'—'}</div></div><div class="bunk-stat"><div class="k">Can Skip</div><div class="v">${canSkip??'—'}</div></div></div>
      <div class="bunk-actions"><button class="bunk-action" onclick="toggleBunkPlan('${key}')">Plan Bunks</button><button class="bunk-action" onclick="toggleFuturePlan('${key}')">Future</button></div>`;
    if(bunkOpen[key]){
      html+=`<div class="bunk-result">`;
      if(canSkip==null) html+=`<strong>Exact limit unavailable.</strong> This row does not contain both conducted and entered counts.`;
      else if(canSkip===0&&pct<75){const need=classesNeededToReach(row);html+=`<strong>Currently below 75%.</strong> Attend the next <strong>${need}</strong> class${need===1?'':'es'} before considering a skip.`;}
      else html+=`<strong>Can skip ${canSkip} class${canSkip===1?'':'es'}</strong> and remain at or above 75%.<br>Math: ${row.present} ÷ (${row.total} + ${canSkip}) × 100 = <strong>${futureAttendance(row,0,canSkip).toFixed(2)}%</strong>`;
      html+=`</div>`;
    }
    if(futureOpen[key]){
      html+=`<div class="bunk-result"><strong>Future attendance & bunk check</strong><div class="future-grid"><div class="future-stepper"><span>Attend</span><div class="future-controls"><button type="button" class="future-minus" onclick="changeFutureCount('${key}','attend',-1)" aria-label="Remove one attended class">−</button><strong id="attend-value-${key}">1</strong><button type="button" class="future-plus" onclick="changeFutureCount('${key}','attend',1)" aria-label="Add one attended class">+</button></div></div><div class="future-stepper"><span>Skip</span><div class="future-controls"><button type="button" class="future-minus" onclick="changeFutureCount('${key}','skip',-1)" aria-label="Remove one skipped class">−</button><strong id="skip-value-${key}">0</strong><button type="button" class="future-plus" onclick="changeFutureCount('${key}','skip',1)" aria-label="Add one skipped class">+</button></div></div></div><div id="future-${key}" class="future-pct">${futureAttendance(row,1,0).toFixed(2)}%</div><div id="future-note-${key}">After those future classes, your attendance would be ${futureAttendance(row,1,0).toFixed(2)}%.</div><div id="future-status-${key}">${futureStatusHTML(row,1,0)}</div></div>`;
    }
    html+=`</div>`;
  });
  html+=`<div class="bunk-result"><strong>Live formula:</strong> Present = Attendance Entered · Total = Classes Conducted · Absent = Attendance Not Entered. Safe bunk limit keeps attendance at or above 75%.</div></div></div>`;
  return html;
}
function renderBunkFloat(){
  const root=document.getElementById('bunk-float-root'); if(!root)return;
  if(!loggedIn){root.innerHTML='';return;}
  const open=root.dataset.open==='1';
  if(open){root.innerHTML=renderBunkCalculatorModal();return;}
  root.innerHTML=`<button id="bunk-fab" class="bunk-fab" aria-label="Open live bunk calculator" title="Live Bunk Calculator"><span>${ICONS.calculator||'▣'}</span><span class="bunk-fab-badge">BUNK</span></button>`;
  const fab=document.getElementById('bunk-fab');
  const saved=JSON.parse(localStorage.getItem('bunk-fab-position-v1')||'null');
  if(saved&&Number.isFinite(saved.x)&&Number.isFinite(saved.y)){fab.style.left=Math.max(6,Math.min(innerWidth-64,saved.x))+'px';fab.style.top=Math.max(60,Math.min(innerHeight-70,saved.y))+'px';}
  else{fab.style.right='14px';fab.style.bottom='88px';}
  // Fully free drag: works with touch, mouse and Android WebView.
  let dragging=false,moved=false,dx=0,dy=0,startX=0,startY=0,pointerId=null;
  const point=(e)=>{
    if(e.touches&&e.touches.length){return {x:e.touches[0].clientX,y:e.touches[0].clientY};}
    return {x:e.clientX,y:e.clientY};
  };
  const beginDrag=(e)=>{
    if(e.type==='mousedown'&&e.button!==0)return;
    const p=point(e),r=fab.getBoundingClientRect();
    dragging=true;moved=false;pointerId=e.pointerId??null;
    startX=p.x;startY=p.y;dx=p.x-r.left;dy=p.y-r.top;
    fab.style.right='auto';fab.style.bottom='auto';fab.style.cursor='grabbing';
    if(fab.setPointerCapture&&e.pointerId!=null){try{fab.setPointerCapture(e.pointerId);}catch(_){}}
    if(e.cancelable)e.preventDefault();
  };
  const moveDrag=(e)=>{
    if(!dragging)return;
    if(e.pointerId!=null&&pointerId!=null&&e.pointerId!==pointerId)return;
    const p=point(e),r=fab.getBoundingClientRect();
    if(Math.abs(p.x-startX)>3||Math.abs(p.y-startY)>3)moved=true;
    const x=Math.max(6,Math.min(window.innerWidth-r.width-6,p.x-dx));
    const y=Math.max(56,Math.min(window.innerHeight-r.height-6,p.y-dy));
    fab.style.left=x+'px';fab.style.top=y+'px';
    if(e.cancelable)e.preventDefault();
  };
  const endDrag=(e)=>{
    if(!dragging)return;
    if(e.pointerId!=null&&pointerId!=null&&e.pointerId!==pointerId)return;
    dragging=false;pointerId=null;fab.style.cursor='grab';
    const r=fab.getBoundingClientRect();
    localStorage.setItem('bunk-fab-position-v1',JSON.stringify({x:r.left,y:r.top}));
    if(e.cancelable)e.preventDefault();
    if(!moved){root.dataset.open='1';renderBunkFloat();}
  };
  // Pointer events (modern browsers/WebView).
  fab.addEventListener('pointerdown',beginDrag,{passive:false});
  fab.addEventListener('pointermove',moveDrag,{passive:false});
  fab.addEventListener('pointerup',endDrag,{passive:false});
  fab.addEventListener('pointercancel',endDrag,{passive:false});
  // Touch fallback for WebViews where pointer events can be unreliable.
  fab.addEventListener('touchstart',beginDrag,{passive:false});
  fab.addEventListener('touchmove',moveDrag,{passive:false});
  fab.addEventListener('touchend',endDrag,{passive:false});
  fab.addEventListener('touchcancel',endDrag,{passive:false});
  // Mouse fallback for desktop browsers.
  fab.addEventListener('mousedown',beginDrag,{passive:false});
  document.addEventListener('mousemove',moveDrag,{passive:false});
  document.addEventListener('mouseup',endDrag,{passive:false});
}
