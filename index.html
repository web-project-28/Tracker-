<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Your Term, Mapped</title>
<meta name="theme-color" content="#1F3B2E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Term Tracker" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Your Term, Mapped","short_name":"Term Tracker","start_url":".","display":"standalone","background_color":"%231F3B2E","theme_color":"%231F3B2E"}' />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1F3B2E; --board-dark:#16291F; --board-deep:#122019; --chalk:#F3F0E4; --chalk-dim:#9FB3A8;
    --yellow:#E8C468; --coral:#E2725B; --rail:#2A4A3A; --rail-light:#365A47; --green:#8FD9A8;
    --radius:14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--board); font-family:'Inter',sans-serif; color:var(--chalk); line-height:1.4; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 18px 72px; }
  header.app-head { margin-bottom:22px; }
  h1 { font-family:'Kalam',cursive; font-size:32px; margin:0 0 6px; line-height:1.15; }
  .sub { color:var(--chalk-dim); font-size:13.5px; margin:0; max-width:46ch; }

  nav#tabs { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 14px; margin-bottom:18px; border-bottom:1px solid var(--rail); scrollbar-width:none; }
  nav#tabs::-webkit-scrollbar { display:none; }
  nav#tabs button { flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--board-dark); border:1px solid var(--rail); color:var(--chalk-dim); padding:8px 14px; border-radius:999px; font-size:13px; font-family:'Inter',sans-serif; font-weight:500; cursor:pointer; white-space:nowrap; transition:background .15s,color .15s,border-color .15s; }
  nav#tabs button svg { width:15px; height:15px; flex-shrink:0; }
  nav#tabs button.active { background:var(--yellow); color:var(--board-deep); border-color:var(--yellow); font-weight:600; }

  .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .section-head h2 { font-family:'Kalam',cursive; font-size:24px; margin:0 0 2px; }
  .section-head p { color:var(--chalk-dim); font-size:13px; margin:0; }

  .btn-add { background:var(--yellow); color:var(--board-deep); border:none; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
  .btn-add:disabled { opacity:.6; }
  .btn-add svg { width:15px; height:15px; }

  .empty { border:1px dashed var(--rail-light); border-radius:var(--radius); padding:28px 20px; text-align:center; color:var(--chalk-dim); font-size:14px; line-height:1.5; }

  .card { background:var(--board-dark); border:1px solid var(--rail); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card .main { min-width:0; flex:1; display:flex; align-items:center; gap:12px; }
  .tag { font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; background:var(--rail); color:var(--yellow); padding:3px 7px; border-radius:5px; letter-spacing:.02em; }
  .title { font-size:14.5px; font-weight:500; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--chalk-dim); }
  .del { background:none; border:none; color:var(--chalk-dim); cursor:pointer; padding:6px; border-radius:8px; flex-shrink:0; }
  .del svg { width:16px; height:16px; }
  .del:hover { background:var(--rail); }

  .form { background:var(--rail); border:1px solid var(--rail-light); border-radius:var(--radius); padding:16px; margin-bottom:18px; display:grid; gap:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label.field { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--chalk-dim); }
  input, select { background:var(--board-deep); color:var(--chalk); border:1px solid var(--rail-light); border-radius:8px; padding:9px 10px; font-family:'IBM Plex Mono',monospace; font-size:13.5px; }
  input:focus, select:focus { outline:2px solid var(--yellow); outline-offset:1px; }
  .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:2px; }
  .btn-ghost { background:none; border:none; color:var(--chalk-dim); font-size:12.5px; padding:8px 12px; cursor:pointer; border-radius:8px; }
  .btn-save { background:var(--yellow); color:var(--board-deep); border:none; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-save svg { width:15px; height:15px; flex-shrink:0; }

  .check-btn { width:21px; height:21px; border:1.5px solid var(--yellow); border-radius:6px; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .check-btn.done { background:var(--yellow); }
  .bar-bg { height:6px; border-radius:99px; background:var(--rail); margin:8px 0 10px; }
  .bar-fill { height:6px; border-radius:99px; }
  .att-actions button { font-size:12px; padding:6px 12px; border-radius:8px; border:none; margin-right:8px; cursor:pointer; background:var(--rail); font-weight:500; }

  .drop { border:1.5px dashed var(--rail-light); border-radius:var(--radius); padding:32px 20px; text-align:center; cursor:pointer; }
  .thumbs { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .thumb { position:relative; width:76px; height:76px; }
  .thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--rail); }
  .thumb button { position:absolute; top:-6px; right:-6px; background:var(--coral); border:none; border-radius:99px; width:19px; height:19px; color:var(--chalk); cursor:pointer; font-size:11px; line-height:1; }

  .warn { display:flex; gap:10px; background:var(--rail); border-left:3px solid var(--yellow); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; line-height:1.5; }
  .warn svg { width:18px; height:18px; flex-shrink:0; margin-top:1px; }

  .review-item { display:flex; gap:10px; align-items:flex-start; background:var(--board-dark); border:1px solid var(--rail); border-radius:var(--radius); padding:14px 16px; margin-bottom:8px; cursor:pointer; }
  .note { font-size:12.5px; color:var(--chalk-dim); margin-bottom:14px; line-height:1.5; }

  details.portal-group { background:var(--board-dark); border:1px solid var(--rail); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  details.portal-group summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; color:var(--chalk); font-weight:600; font-size:14.5px; }
  details.portal-group summary::-webkit-details-marker { display:none; }
  details.portal-group summary .chev { transition:transform .15s; color:var(--chalk-dim); }
  details.portal-group summary .chev svg { width:14px; height:14px; }
  details.portal-group[open] summary .chev { transform:rotate(90deg); }
  details.portal-group .group-body { padding:0 14px 14px; }
  details.portal-group .card { background:var(--board-deep); }

  .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  ::selection { background:var(--yellow); color:var(--board-deep); }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-head">
    <h1>Your Term, Mapped</h1>
    <p class="sub">Classes, assignments, exams and attendance — kept in one place, saved right here in your browser.</p>
  </header>
  <nav id="tabs"></nav>
  <div id="content"></div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
</div>

<script>
const STORAGE_KEY = "student-tracker-data-v1";
const API_KEY_STORAGE = "student-tracker-gemini-key-v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_MAP = {monday:"Mon",mon:"Mon",tuesday:"Tue",tue:"Tue",tues:"Tue",wednesday:"Wed",wed:"Wed",thursday:"Thu",thu:"Thu",thurs:"Thu",friday:"Fri",fri:"Fri",saturday:"Sat",sat:"Sat",sunday:"Sun",sun:"Sun"};
const normDay = d => DAY_MAP[(d||"").toLowerCase().trim()] || d || "Mon";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let state = { timetable:[], assignments:[], exams:[], attendance:[], custom:{} };
let portalPages = {}; // NOT persisted -- always fresh from the live portal each login
let tab = "timetable";
let draft = null;      // {type, ...fields} for open add-forms
let shots = [];        // {id, dataUrl, mediaType, base64}
let review = [];       // extracted items pending confirm
let extracting = false;
let extractError = "";
let apiKey = localStorage.getItem(API_KEY_STORAGE) || "";
let showKeyInput = false;
let keySavedMsg = "";
const REMINDER_DAYS = 2; // flag assignments/exams due within this many days
const NOTIFIED_KEY = "student-tracker-notified-v1";
const BACKEND_URL = "https://srm-tracker-backend.vercel.app/api/portal-login";

let portalUsername = "";
let portalPassword = "";
let portalCaptcha = "";
let portalCaptchaImage = "";
let portalSessionCookie = "";
let portalStatus = ""; // "", "loading", "ready", "loggingin", "success", "error"
let portalMessage = "";
let loggedIn = false;
let refreshing = false;
let attendanceCode = "";
let submittingAttendance = false;
let attendanceMessage = "";
let attendanceSuccess = false;
let discovering = false;
let discoverStatus = "";
let pageLoadError = "";

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}
function getReminders() {
  const items = [];
  state.assignments.forEach(a => {
    if (a.done || !a.due) return;
    const d = daysUntil(a.due);
    if (d !== null && d <= REMINDER_DAYS) items.push({ id:"a:"+a.id, kind:"Assignment", label:a.title, sub:a.subject, days:d });
  });
  state.exams.forEach(ex => {
    if (!ex.date) return;
    const d = daysUntil(ex.date);
    if (d !== null && d <= REMINDER_DAYS) items.push({ id:"e:"+ex.id, kind:"Exam", label:ex.subject, sub:ex.room, days:d });
  });
  return items.sort((x,y)=>x.days-y.days);
}
function reminderText(item) {
  if (item.days < 0) return `overdue by ${Math.abs(item.days)} day${Math.abs(item.days)===1?"":"s"}`;
  if (item.days === 0) return "due today";
  if (item.days === 1) return "due tomorrow";
  return `due in ${item.days} days`;
}
function renderReminderBanner() {
  const items = getReminders();
  const permission = ("Notification" in window) ? Notification.permission : "unsupported";
  let html = "";
  if (items.length > 0) {
    html += `<div class="warn" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;align-items:flex-start;gap:8px;">
        ${ICONS.warn}
        <div style="flex:1;">
          <div style="font-weight:600;margin-bottom:4px;">${items.length} thing${items.length===1?"":"s"} coming up</div>
          ${items.map(it => `<div class="meta" style="color:var(--chalk);margin-bottom:2px;">${esc(it.kind)}: ${esc(it.label)}${it.sub?` (${esc(it.sub)})`:""} — <span style="color:${it.days<0?'var(--coral)':'var(--yellow)'};">${reminderText(it)}</span></div>`).join("")}
        </div>
      </div>
      ${permission==="default" ? `<button class="btn-add" style="align-self:flex-start;" onclick="enableNotifications()">${ICONS.check} Turn on notifications</button>` : ""}
      ${permission==="denied" ? `<p class="meta" style="margin:0;">Notifications are blocked in your browser settings — enable them there if you want alerts, this banner will still show either way.</p>` : ""}
    </div>`;
  }
  return html;
}
function enableNotifications() {
  if (!("Notification" in window)) return;
  Notification.requestPermission().then(() => { checkAndNotify(true); render(); });
}
function checkAndNotify(force) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let notified = {};
  try { notified = JSON.parse(localStorage.getItem(NOTIFIED_KEY) || "{}"); } catch(e) {}
  const today = todayStr();
  getReminders().forEach(item => {
    const key = item.id + ":" + today;
    if (!force && notified[key]) return;
    new Notification("Your Term, Mapped", { body: `${item.kind}: ${item.label} — ${reminderText(item)}` });
    notified[key] = true;
  });
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch(e) { /* first run */ }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { console.error("Save failed", e); }
}

const ICONS = {
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  sparkles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>',
};

const BASE_TABS = [
  {id:"myportal", label:"My Portal", icon:"folder"},
  {id:"timetable", label:"Timetable", icon:"calendar"},
  {id:"assignments", label:"Assignments", icon:"list"},
  {id:"exams", label:"Exams", icon:"cap"},
  {id:"attendance", label:"Attendance", icon:"check"},
];
function buildTabs() {
  const customTabs = Object.keys(state.custom || {}).map(cat => ({ id: "custom:"+cat, label: cat, icon: "folder" }));
  return [...BASE_TABS, ...customTabs, {id:"import", label:"AI Import", icon:"sparkles"}];
}

function renderTabs() {
  const TABS = buildTabs();
  document.getElementById("tabs").innerHTML = TABS.map(t => `
    <button data-tab="${t.id}" class="${tab===t.id?'active':''}">
      ${ICONS[t.icon]}${esc(t.label)}
    </button>
  `).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; draft=null; render(); });
}

function sectionHead(title, sub, addLabel, onAdd) {
  return `<div class="section-head">
    <div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>
    ${onAdd ? `<button class="btn-add" onclick="${onAdd}">${ICONS.plus}${esc(addLabel)}</button>` : ""}
  </div>`;
}

function renderTimetable() {
  const sorted = [...state.timetable].sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || (a.start||"").localeCompare(b.start||""));
  let html = sectionHead("Class Timetable", `${state.timetable.length} ${state.timetable.length===1?'class':'classes'} on the board`, null, null);
  if (draft && draft.type==='timetable') html += formTimetable();
  html += sorted.length===0 ? `<div class="empty">No classes yet. Add your first one to start filling in the week.</div>` :
    sorted.map(c => `
      <div class="card">
        <div class="main">
          <span class="tag">${esc(c.day)}</span>
          <div style="min-width:0;">
            <div class="title">${esc(c.subject)}</div>
            <div class="meta">${esc(c.start)}–${esc(c.end)}${c.room?` · ${esc(c.room)}`:''}</div>
          </div>
        </div>
        <button class="del" onclick="removeItem('timetable','${c.id}')">${ICONS.trash}</button>
      </div>`).join("");
  return html;
}
function formTimetable() {
  const d = draft;
  return `<div class="form">
    <div class="grid2">
      <label class="field">Day
        <select onchange="draft.day=this.value">
          ${DAYS.map(x=>`<option value="${x}" ${d.day===x?'selected':''}>${x}</option>`).join("")}
        </select>
      </label>
      <label class="field">Subject<input value="${esc(d.subject)}" oninput="draft.subject=this.value" placeholder="e.g. Linear Algebra" /></label>
      <label class="field">Start time<input type="time" value="${esc(d.start)}" oninput="draft.start=this.value" /></label>
      <label class="field">End time<input type="time" value="${esc(d.end)}" oninput="draft.end=this.value" /></label>
      <label class="field">Room / link<input value="${esc(d.room)}" oninput="draft.room=this.value" placeholder="e.g. Block C-204" /></label>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
      <button class="btn-save" onclick="saveTimetable()">Save</button>
    </div>
  </div>`;
}
function saveTimetable(){
  if (!draft.subject) return cancelForm();
  state.timetable.push({id:uid(), day:draft.day||"Mon", start:draft.start||"", end:draft.end||"", subject:draft.subject, room:draft.room||""});
  save(); cancelForm();
}

function renderAssignments() {
  const pending = state.assignments.filter(a=>!a.done).length;
  let html = sectionHead("Assignments", `${pending} pending`, null, null);
  if (draft && draft.type==='assignments') html += formAssignment();
  const sorted = [...state.assignments].sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  html += sorted.length===0 ? `<div class="empty">Nothing tracked yet. Add a deadline before it sneaks up on you.</div>` :
    sorted.map(a=>`
      <div class="card">
        <div class="main">
          <button class="check-btn ${a.done?'done':''}" onclick="toggleDone('${a.id}')">${a.done?ICONS.check.replace('viewBox="0 0 24 24"','width="12" height="12" viewBox="0 0 24 24"'):''}</button>
          <div style="min-width:0;">
            <div class="title" style="${a.done?'text-decoration:line-through;opacity:.5;':''}">${esc(a.title)}</div>
            <div class="meta">${esc(a.subject)}${a.due?` · due ${esc(a.due)}`:''}</div>
          </div>
        </div>
        <button class="del" onclick="removeItem('assignments','${a.id}')">${ICONS.trash}</button>
      </div>`).join("");
  return html;
}
function formAssignment(){
  const d = draft;
  return `<div class="form">
    <div class="grid2">
      <label class="field">Title<input value="${esc(d.title)}" oninput="draft.title=this.value" placeholder="e.g. Lab report 3" /></label>
      <label class="field">Subject<input value="${esc(d.subject)}" oninput="draft.subject=this.value" placeholder="e.g. Physics" /></label>
      <label class="field">Due date<input type="date" value="${esc(d.due)}" oninput="draft.due=this.value" /></label>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
      <button class="btn-save" onclick="saveAssignment()">Save</button>
    </div>
  </div>`;
}
function saveAssignment(){
  if (!draft.title) return cancelForm();
  state.assignments.push({id:uid(), title:draft.title, subject:draft.subject||"", due:draft.due||"", done:false});
  save(); cancelForm();
}
function toggleDone(id){ const a=state.assignments.find(x=>x.id===id); if(a){a.done=!a.done; save(); render();} }

function renderExams() {
  let html = sectionHead("Exam Schedule", `${state.exams.length} upcoming`, null, null);
  if (draft && draft.type==='exams') html += formExam();
  const sorted = [...state.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  html += sorted.length===0 ? `<div class="empty">No exams logged yet.</div>` :
    sorted.map(ex=>`
      <div class="card">
        <div>
          <div class="title">${esc(ex.subject)}</div>
          <div class="meta">${esc(ex.date)}${ex.time?` · ${esc(ex.time)}`:''}${ex.room?` · ${esc(ex.room)}`:''}</div>
        </div>
        <button class="del" onclick="removeItem('exams','${ex.id}')">${ICONS.trash}</button>
      </div>`).join("");
  return html;

async function startPortalLogin() {
  portalStatus = "loading";
  portalMessage = "";
  portalCaptchaImage = "";
  portalCaptcha = "";
  render();
  try {
    const res = await fetch(`${BACKEND_URL}?step=start`);
    const data = await res.json();
    if (data.error) {
      portalStatus = "error";
      portalMessage = data.error;
    } else {
      portalSessionCookie = data.sessionCookie || "";
      portalCaptchaImage = data.captchaImage || "";
      portalCaptcha = data.captchaText || ""; // auto fill captcha
      portalStatus = "ready";
    }
  } catch (e) {
    portalStatus = "error";
    portalMessage = "Couldn't reach the backend: " + e.message;
  }
  render();
}

async function submitPortalLogin() {
  if (!portalUsername || !portalPassword || !portalCaptcha) {
    portalMessage = "Fill in your registration number, password, and the captcha text.";
    render();
    return;
  }
  portalStatus = "loggingin";
  portalMessage = "";
  render();
  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        step: "login",
        username: portalUsername,
        password: portalPassword,
        captcha: portalCaptcha,
        sessionCookie: portalSessionCookie,
      }),
    });
    const data = await res.json();
    if (data.error) {
      portalStatus = "error";
      portalMessage = data.error + (data.debugStatus ? ` (status ${data.debugStatus})` : "");
      startPortalLogin(); // captcha is single-use, load a fresh one for the retry
      return;
    }
    portalSessionCookie = data.sessionCookie || portalSessionCookie;
    portalStatus = "success";
    portalMessage = "";
    loggedIn = true;
    tab = "myportal";
    refreshPortalData();
  } catch (e) {
    portalStatus = "error";
    portalMessage = "Something went wrong: " + e.message;
    render();
  }
}

async function refreshPortalData() {
  refreshing = true;
  portalMessage = "";
  render();
  await refreshAllPortalPages();
  portalMessage = Object.keys(portalPages).length
    ? "Refreshed your connected sections."
    : "Logged in. Tap 'Discover & load everything' under My Portal.";
  refreshing = false;
  render();
}

function logoutPortal() {
  const clearData = confirm("Log out? Tap OK to also clear the portal data loaded in this browser, or Cancel to keep it and just log out.");
  loggedIn = false;
  portalUsername = "";
  portalPassword = "";
  portalCaptcha = "";
  portalCaptchaImage = "";
  portalSessionCookie = "";
  portalStatus = "";
  portalMessage = "";
  if (clearData) {
    portalPages = {};
    save();
  }
  render();
}

function renderBunkManagement() {
  const MIN = 75;

  let html = `
    <div class="card" style="display:block;margin-bottom:18px;">
      <div style="margin-bottom:14px;">
        <h2 style="margin:0 0 5px;">Bunk Management</h2>

    const current = (present / total) * 100;

    let safeBunks = 0;
    while (
      (present / (total + safeBunks + 1)) * 100 >= MIN

    const afterOne = (present / (total + 1)) * 100;
    const safe = current >= MIN;

    html += `

          ">
            ${current.toFixed(1)}%

          justify-content:space-between;
          margin-top:8px;

        <div class="note" style="margin:8px 0 0;">

            safeBunks > 0
              ? `You can bunk <strong>${safeBunks}</strong> more class${safeBunks === 1 ? "" : "es"} and stay at or above ${MIN}%.`
              : `No additional bunk is safe while maintaining ${MIN}%.`
          }
        </div>

        <div class="note" style="margin:5px 0 0;">
          After 1 bunk: ${afterOne.toFixed(1)}%
        </div>

      </div>
    `;
  });

  html += `
    <div style="
      display:flex;
      gap:8px;
      margin-top:14px;
      margin-bottom:14px;
    ">
      <button
        class="${bunkMode === "bunks" ? "btn-save" : "btn-ghost"}"
        style="flex:1;"
        onclick="bunkMode='bunks';render();">
        Bunks
      </button>

      <button
        class="${bunkMode === "future" ? "btn-save" : "btn-ghost"}"
        style="flex:1;"
        onclick="bunkMode='future';render();">
        Future
      </button>
    </div>
  `;

  if (bunkMode === "future") {
    html += `
      <div style="
        background:var(--board-dark);
        border:1px solid var(--rail);
        border-radius:10px;
        padding:13px;
      ">
        <strong>Future Attendance</strong>

        <label class="field" style="margin-top:10px;">
          Classes you will attend
          <input
            type="number"
            min="0"
            value="${futureAttend}"
            oninput="
              futureAttend=Math.max(0,Number(this.value)||0);
              render();
            "

        </label>

        <label class="field" style="margin-top:10px;">
          Classes you may bunk
          <input
            type="number"
            min="0"
            value="${futureBunk}"

              futureBunk=Math.max(0,Number(this.value)||0);
              render();
            "
          />
        </label>
    `;

    state.attendance.forEach(a => {
      const present = Number(a.present || 0);
      const total = Number(a.total || 0);

      if (!total) return;

      const futurePresent = present + futureAttend;
      const futureTotal =
        total + futureAttend + futureBunk;

      const futurePct =
        (futurePresent / futureTotal) * 100;

      const safe = futurePct >= MIN;

      html += `
        <div style="
          margin-top:12px;
          padding:10px;
          border-radius:8px;
          background:var(--board-deep);

  const keys = Object.keys(portalPages);
  let html = sectionHead("My Portal", `${keys.length} section${keys.length===1?"":"s"} loaded from your portal`, null, null);

  html += `<button class="btn-add" style="margin-bottom:16px;" onclick="discoverAndFetchAll()" ${discovering?"disabled":""}>
    ${ICONS.sparkles} ${discovering ? discoverStatus : "Discover & load everything"}
  </button>`;

  if (pageLoadError) {
    html += `<div class="warn">${ICONS.warn}<span>${esc(pageLoadError)}</span></div>`;
  }

  if (keys.length === 0 && !discovering) {
    html += `<div class="empty">Nothing loaded yet. Tap "Discover & load everything" above -- it reads your portal's own menu and pulls every section automatically, no links to paste.</div>`;
  } else {
    const groups = {};
    keys.forEach(key => {
      const page = portalPages[key];
      const g = page.group || "Other";
      (groups[g] = groups[g] || []).push(key);
    });
    Object.keys(groups).forEach(groupName => {
      html += `<details class="portal-group" id="${groupAnchor(groupName)}" ${groups[groupName].length<=3?"open":""}>
        <summary>${esc(groupName)} <span class="meta">${groups[groupName].length}</span> <span class="chev">${ICONS.chev || '&#8250;'}</span></summary>
        <div class="group-body">`;
      groups[groupName].forEach(key => {
        const page = portalPages[key];
        const isRefreshing = !!refreshingKeys[key];
        html += `<div class="card" id="${itemAnchor(key)}" style="display:block;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span class="title">${esc(page.label || page.title || key)}</span>
            <button onclick='refreshSection(${JSON.stringify(key)})' ${isRefreshing?"disabled":""} style="background:none;border:none;color:var(--yellow);cursor:pointer;padding:4px;display:flex;align-items:center;gap:4px;font-size:11px;">
              ${ICONS.sparkles.replace('viewBox="0 0 24 24"','width="13" height="13" viewBox="0 0 24 24"')} ${isRefreshing?"…":""}
            </button>
          </div>`;
        if (page.tables && page.tables.length > 0) {
          page.tables.forEach(table => {
            const rows = table.slice(0, 12); // keep it readable, avoid huge dumps
            html += `<div style="overflow-x:auto;margin-bottom:10px;border:1px solid var(--rail);border-radius:8px;"><table style="width:100%;border-collapse:collapse;font-size:12px;">`;
            rows.forEach((row, i) => {
              html += `<tr>${row.map(cell => `<td style="border-bottom:1px solid var(--rail);padding:7px 10px;color:${i===0?'var(--yellow)':'var(--chalk)'};font-weight:${i===0?600:400};">${esc(cell)}</td>`).join("")}</tr>`;
            });
            html += `</table></div>`;
            if (table.length > 12) html += `<p class="meta">+ ${table.length-12} more rows</p>`;
          });
        } else if (page.text && page.text.trim()) {
          const fullText = page.text.trim();
          const firstLine = fullText.split("\n").find(l => l.trim()) || fullText.slice(0,120);
          if (fullText.length > 220) {
            html += `<p style="font-size:13px;color:var(--chalk);margin:0 0 6px;">${esc(firstLine)}</p>
              <details><summary style="cursor:pointer;color:var(--yellow);font-size:12.5px;">Show full text</summary>
                <p style="font-size:13px;color:var(--chalk);white-space:pre-line;line-height:1.6;margin-top:8px;">${esc(fullText)}</p>
              </details>`;
          } else {
            html += `<p style="font-size:13px;color:var(--chalk);white-space:pre-line;line-height:1.6;">${esc(fullText)}</p>`;
          }
        } else {
          html += `<p class="meta">No content found on this page.</p>`;
        }
        html += `</div>`;
      });
      html += `</div></details>`;
    });
  }

  return html;
}

let refreshingKeys = {};

async function refreshSection(key) {
  const page = portalPages[key];
  if (!page) return;
  refreshingKeys[key] = true;
  render();
  try {
    const pageData = await fetchPortalPage(page.url, page.postBody);
    portalPages[key] = { ...page, title: pageData.title, tables: pageData.tables, text: pageData.text };
  } catch (e) {
    // keep old data on failure rather than wiping it
  }
  delete refreshingKeys[key];
  render();
}

async function fetchPortalPage(path, postBody) {
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ step: "fetchPage", sessionCookie: portalSessionCookie, path, postBody }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function discoverAndFetchAll() {
  discovering = true;
  pageLoadError = "";
  discoverStatus = "Loading your real portal sections…";
  portalPages = {}; // always start clean -- never show data from a previous login
  render();
  try {
    let done = 0;
    for (const link of KNOWN_SECTIONS) {
      discoverStatus = `Loading ${link.label}… (${done+1}/${KNOWN_SECTIONS.length})`;
      render();
      try {
        const pageData = await fetchPortalPage(link.url, link.postBody);
        const hasTables = pageData.tables && pageData.tables.length;
        const hasText = pageData.text && pageData.text.trim().length > 0;
        const key = link.url + (link.postBody ? "?" + link.postBody : "");
        if (hasTables || hasText) {
          portalPages[key] = { label: link.label, group: link.group || groupForLabel(link.label), title: pageData.title, tables: pageData.tables, text: pageData.text, url: link.url, postBody: link.postBody };
        }
      } catch (e) {
        // skip pages that fail rather than stopping everything
      }
      done++;
    }
    save();
  } catch (e) {
    pageLoadError = "Couldn't discover sections: " + e.message;
  }
  discovering = false;
  render();
}

function saveApiKey(){
  if (!apiKey || !apiKey.trim()) {
    keySavedMsg = "";
    extractError = "Paste a key into the box first, then tap Save key.";
    render();
    return;
  }
  try {
    localStorage.setItem(API_KEY_STORAGE, apiKey.trim());
    const check = localStorage.getItem(API_KEY_STORAGE);
    if (check === apiKey.trim()) {
      keySavedMsg = "Key saved on this device ✓";
      extractError = "";
    } else {
      keySavedMsg = "";
      extractError = "Save didn't stick — your browser may be blocking storage (private/incognito mode blocks this). Try a normal browser tab.";
    }
  } catch(e) {
    keySavedMsg = "";
    extractError = "Couldn't save the key: " + (e.message || "storage is blocked in this browser.");
  }
  render();
}

document.getElementById("fileInput").onchange = (e) => {
  const files = Array.from(e.target.files||[]);
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const m = dataUrl.match(/^data:(.*?);base64,(.*)$/);
      shots.push({id:uid(), dataUrl, mediaType: m?m[1]:file.type, base64: m?m[2]:""});
      remaining--;
      if (remaining===0) render();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = "";
};

async function extractFromShots(){
  if (!shots.length) return;
  if (!apiKey) {
    extractError = "Add your free Google AI Studio API key above first, then tap Save key.";
    render();
    return;
  }
  extracting = true; extractError=""; review=[]; render();
  try {
    const promptText =
      "These are screenshots from a student portal. They may show a class timetable, assignments, exams, attendance, " +
      "grades/results, fees/payments, notices/announcements, faculty contacts, or any other student information. " +
      "Extract EVERY piece of information visible — not just timetable or exam entries. " +
      "Return ONLY a JSON array (no markdown fences, no commentary). Use these exact shapes when the content matches:\n" +
      '{"kind":"timetable","day":"Mon".."Sun","start":"HH:MM","end":"HH:MM","subject":"...","room":"..."}\n' +
      '{"kind":"assignment","title":"...","subject":"...","due":"YYYY-MM-DD"}\n' +
      '{"kind":"exam","subject":"...","date":"YYYY-MM-DD","time":"HH:MM","room":"..."}\n' +
      "For anything else (grades, fees, notices, results, contacts, announcements, or any other data), use:\n" +
      '{"kind":"other","category":"short label such as Grades, Fees, Notices, or Contacts","fields":{"Field name":"value"}}\n' +
      "Use the same category label consistently so related items group together. " +
      "Use empty string for any field you cannot read. If you genuinely cannot find any relevant information, return [].";

    const parts = [
      { text: promptText },
      ...shots.map(s => ({ inline_data: { mime_type: s.mediaType, data: s.base64 } }))
    ];

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts }] })
      }
    );
    const data = await response.json();
    if (data.error) {
      extractError = "Gemini API error: " + (data.error.message || "check that your key is correct.");
      return;
    }
    const text = ((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    const clean = text.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    if (!Array.isArray(parsed) || parsed.length===0) {
      extractError = "Couldn't find any readable details in those images. Try a clearer or less cropped screenshot.";
    } else {
      review = parsed.map(item => ({id:uid(), selected:true, ...item}));
    }
  } catch(e) {
    extractError = "Something went wrong reaching the API. Check your internet connection and that your key is correct.";
  } finally {
    extracting = false; render();
  }
}
